<style>
:root{
  --ink:#0A0A0A; --plate:#141414; --plate2:#1D1D1D; --line:#2E2E2E;
  --steel:#8C8C8C; --mist:#C9C9C9; --paper:#FFFFFF;
  --signal:#34E6A3; --go:#34E6A3; --danger:#FF4D4D; --rule:rgba(255,255,255,.09);
  --home:#22C08A;
  --ease-out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;touch-action:manipulation}
body{margin:0;background:var(--ink);color:var(--paper);
  font:400 16px/1.55 Inter,system-ui,sans-serif;padding-bottom:100px;padding-top:58px;
  overflow-x:hidden;overscroll-behavior-x:none;width:100%;touch-action:manipulation}
h1,h2,h3{font-family:'Barlow Condensed',Impact,sans-serif;letter-spacing:.01em;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.eyebrow{font:700 11px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}

/* persistent mint anchor strip — stays fixed/visible across every screen,
   including "focus mode" mid-workout where the full header collapses away,
   so there's always a one-tap route back to the home screen */
.topstrip{position:fixed;top:0;left:0;right:0;height:58px;background:var(--signal);
  z-index:50;display:flex;align-items:center;justify-content:center;gap:9px;
  padding:0 20px;cursor:pointer;border:0}
.topstrip .tmark{font-family:'Fredoka',sans-serif;font-weight:700;font-size:29px;
  letter-spacing:-.01em;color:var(--ink);text-transform:uppercase}
.topstrip .tlogo{height:34px;width:auto;flex:0 0 auto;display:block}

/* home screen stays true black like the rest of the app; stat cards use a
   lighter dark-grey fill (--plate2) so they read as distinct tiles without
   introducing a second green that clashes with the top mint strip. */
body.home{background:var(--ink)}
body.home .stat div{background:var(--plate2);border-color:var(--plate2)}

/* header + day-nav collapse into "focus mode" once a workout is underway, so the
   carousel below can claim the freed space — see body.focus rules further down */
header{padding:22px 0 18px;border-bottom:1px solid var(--rule);
  max-height:260px;overflow:hidden;opacity:1;
  transition:max-height 420ms var(--ease-out),opacity 220ms var(--ease-out),border-color 420ms var(--ease-out)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer}
.brand .mark{width:11px;height:11px;border-radius:2px;background:var(--signal);flex:0 0 auto}
.brand h1{font-family:'Fredoka',sans-serif;font-size:46px;font-weight:700;text-transform:uppercase;
  line-height:1.15;letter-spacing:-.01em;display:inline-block}
.brand .sub{width:100%;font:700 10.5px/1 Inter,sans-serif;letter-spacing:.22em;
  text-transform:uppercase;color:var(--steel)}
/* stat row rendered as individual rounded cards rather than bare label/number
   pairs — matches the card-grid treatment used across the reference apps */
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:20px}
.stat div{font:700 9.5px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);
  background:var(--plate2);border:1px solid var(--line);border-radius:14px;padding:12px 10px 11px}
.stat b{display:block;font-family:'Anton',sans-serif;font-weight:400;font-size:22px;
  letter-spacing:0;color:var(--paper);margin-top:6px}
.stat b small{font-family:Inter,sans-serif;font-size:11px;color:var(--steel);font-weight:600;
  text-transform:uppercase;letter-spacing:.04em}
@media(max-width:520px){.stat{grid-template-columns:repeat(2,1fr)}}
@keyframes statBump{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.stat b.bump{animation:statBump 260ms var(--ease-out)}
.hero-v.bump{animation:statBump 260ms var(--ease-out)}
@media(prefers-reduced-motion:reduce){.stat b.bump,.hero-v.bump{animation:none}}

nav{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:18px 0;scrollbar-width:none;
  max-height:96px;opacity:1;
  transition:max-height 420ms var(--ease-out),opacity 220ms var(--ease-out),padding 420ms var(--ease-out)}
nav::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1.5px solid var(--line);background:transparent;color:var(--mist);
  padding:10px 17px 9px;border-radius:10px;cursor:pointer;font-family:'Barlow Condensed',sans-serif;
  font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  transition:background 140ms var(--ease-out),color 140ms var(--ease-out),border-color 140ms var(--ease-out)}
.day .ddate{font:600 11px/1 Inter,sans-serif;letter-spacing:0;text-transform:none;color:var(--steel)}
.day[aria-selected=true] .ddate{color:#5C5C5C}
.day .t{display:block;font:700 8.5px/1 Inter,sans-serif;letter-spacing:.1em;
  color:var(--steel);text-transform:uppercase;margin-top:3px}
.day[aria-selected=true]{background:var(--paper);color:var(--ink);border-color:var(--paper)}
.day[aria-selected=true] .t{color:#5C5C5C}
.day:active{transform:scale(.96)}
@media(hover:hover) and (pointer:fine){.day:not([aria-selected=true]):hover{border-color:var(--signal);color:var(--signal)}}
.day.done::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--go);margin-left:7px;vertical-align:middle}

.homebtn{flex:0 0 auto;border:1.5px solid var(--line);background:transparent;color:var(--mist);
  padding:0 15px;border-radius:10px;cursor:pointer;display:grid;place-items:center;
  transition:background 140ms var(--ease-out),color 140ms var(--ease-out),border-color 140ms var(--ease-out)}
.homebtn svg{width:19px;height:19px}
.homebtn[aria-selected=true]{background:var(--signal);color:var(--ink);border-color:var(--signal)}
@media(hover:hover) and (pointer:fine){.homebtn:not([aria-selected=true]):hover{border-color:var(--signal);color:var(--signal)}}

.hmhero{padding:26px 22px;border-radius:18px;background:var(--plate2);border:1px solid var(--line);margin-bottom:16px}
.hmhero .hmgreet{font:800 10px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--steel)}
.hmhero h2{font-family:'Barlow Condensed',sans-serif;font-size:32px;text-transform:uppercase;margin:6px 0 14px}
.hmhero p{color:var(--mist);font-size:14.5px;line-height:1.5;margin:14px 0 0}
.hmstart{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;
  background:var(--signal);color:var(--ink);padding:16px;border-radius:999px;cursor:pointer;
  font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;transition:transform 120ms var(--ease-out);margin:0}
.hmstart:active{transform:scale(.97)}
.hmstart.done{background:transparent;border:1.5px solid var(--go);color:var(--go)}
.hmquick{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:14px}
.hmquick button{background:var(--plate);border:1px solid var(--line);color:var(--mist);border-radius:10px;
  padding:9px 6px;font:700 12.5px/1.2 'Barlow Condensed',sans-serif;text-transform:uppercase;cursor:pointer;
  position:relative}
.hmquick button[aria-current=true]{border-color:var(--signal);color:var(--paper)}
.hmquick button .qdate{font:600 10.5px/1 Inter,sans-serif;letter-spacing:0;color:var(--steel)}
.hmquick button .qd{display:block;font:700 9px/1 Inter,sans-serif;letter-spacing:.06em;color:var(--steel);margin-top:3px}
.hmquick button.qdone::after{content:"";position:absolute;top:6px;right:6px;width:6px;height:6px;
  border-radius:50%;background:var(--go)}

/* once a workout starts (any exercise card is active), header + day-nav fold away —
   nothing to gain there mid-set; the pager below is enough orientation */
body.focus header{max-height:0;opacity:0;border-color:transparent}
body.focus nav{max-height:0;opacity:0;padding-top:0;padding-bottom:0}

.shead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  padding:6px 0 18px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.shead h2{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:800;text-transform:uppercase}
.shead p{margin:7px 0 0;color:var(--steel);font-size:15px;line-height:1.55;max-width:46ch}
.tags{display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.tag{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink);background:var(--signal);
  padding:5px 10px;border-radius:20px;white-space:nowrap}
.tag.n{color:var(--mist);background:transparent;border:1.5px solid var(--line)}

.gear{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 0 3px}
.gk{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.14em;
  text-transform:uppercase;color:var(--steel);white-space:nowrap}
.gpill{font:600 12.5px/1 Inter,sans-serif;color:var(--mist);
  background:var(--plate2);border:1px solid var(--line);border-radius:20px;padding:6px 13px;
  transition:border-color 140ms var(--ease-out)}

.wktrack{display:flex;flex-direction:column;gap:2px}
.wkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.wkrow:first-child{border-top:none}
.wkrow.cur{background:rgba(52,230,163,.08);margin:0 -10px;padding:10px 10px;border-radius:8px;border-top:none}
.wkdate{font:700 12px/1 Inter,sans-serif;color:var(--steel);flex:0 0 116px;white-space:nowrap}
.wkpips{display:flex;gap:5px;flex:1}
.pip{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;
  font:800 10px/1 Inter,sans-serif;border:1.5px solid var(--line);color:var(--steel);background:var(--plate2);
  cursor:pointer;padding:0;transition:background 140ms var(--ease-out),border-color 140ms var(--ease-out)}
.pip:active:not(:disabled){transform:scale(.9)}
.pip:disabled{opacity:.35;cursor:default}
.pip.on{background:var(--go);border-color:var(--go);color:var(--ink)}
@media(hover:hover) and (pointer:fine){.pip:not(:disabled):not(.on):hover{border-color:var(--signal);color:var(--signal)}}

.nudge{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;font-size:14.5px;color:var(--mist);
  background:var(--plate2);border:1px solid var(--rule);border-left:3px solid var(--signal);
  border-radius:8px;padding:13px 15px;margin:16px 0}
.nudge .nb{font:800 10.5px/1 Inter,sans-serif;letter-spacing:.1em;
  text-transform:uppercase;color:var(--signal);white-space:nowrap}

.rate-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.ratebtn{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;
  text-transform:uppercase;letter-spacing:.02em;background:var(--plate2);
  border:1.5px solid var(--line);color:var(--mist);padding:12px 4px;border-radius:10px;
  cursor:pointer;text-align:center;line-height:1.15;
  transition:background 140ms var(--ease-out),border-color 140ms var(--ease-out),color 140ms var(--ease-out)}
.ratebtn:active{transform:scale(.95)}
.ratebtn[aria-pressed=true]{background:var(--signal);border-color:var(--signal);color:var(--ink)}
@media(hover:hover) and (pointer:fine){.ratebtn:not([aria-pressed=true]):hover{border-color:var(--signal);color:var(--signal)}}
@keyframes confirmPulse{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}
.ratebtn.pulse{animation:confirmPulse 340ms var(--ease-out)}
@media(max-width:520px){.rate-row{font-size:12.5px}.ratebtn{font-size:12.5px;padding:11px 3px}}

.ex{border:1px solid var(--rule);border-radius:22px;background:var(--plate);overflow:hidden;
  box-shadow:0 20px 44px -26px rgba(0,0,0,.85)}
@keyframes cardIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.ex.reveal>div>*{animation:cardIn 420ms var(--ease-out) backwards}
.ex.reveal>div>*:nth-child(1){animation-delay:0ms}
.ex.reveal>div>*:nth-child(2){animation-delay:45ms}
.ex.reveal>div>*:nth-child(3){animation-delay:85ms}
.ex.reveal>div>*:nth-child(4){animation-delay:120ms}
.ex.reveal>div>*:nth-child(5){animation-delay:150ms}
.ex.reveal>div>*:nth-child(n+6){animation-delay:175ms}
@media(prefers-reduced-motion:reduce){.ex.reveal>div>*{animation:none}}
.exlabel{font:800 12px/1 Inter,sans-serif;letter-spacing:.14em;
  text-transform:uppercase;color:var(--steel);margin-bottom:8px}
.exi h3,.hero-name{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:800;
  text-transform:uppercase;line-height:1.02;letter-spacing:0}
.kit{display:block;font:600 12.5px/1 Inter,sans-serif;letter-spacing:.02em;
  text-transform:uppercase;color:var(--steel);margin-top:6px}

/* hero weight+reps display — the ONE pairing that matters while you're standing
   there holding the bell. Per reference-app audit (NTC/Fitbod/Hevy): during an
   active set nothing else on the card should compete with this in size. Weight
   is the hero; reps ride alongside at ~60% scale, same family. */
.hero-stat{margin-top:8px;padding:9px 14px;border-radius:14px;
  background:linear-gradient(150deg,rgba(52,230,163,.16),rgba(52,230,163,.03));
  border:1px solid rgba(52,230,163,.28);display:flex;align-items:stretch;gap:16px}
.hero-block{min-width:0;flex:1 1 0}
.hero-block.sub{padding-left:16px;border-left:1px solid rgba(52,230,163,.22)}
.hero-k{font:800 10.5px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mist)}
.hero-v{font-family:'Anton',sans-serif;font-weight:400;
  font-size:clamp(20px,5.4vw,36px);line-height:1.08;margin-top:5px;color:var(--signal);letter-spacing:.005em;
  word-break:break-word}
.hero-block.sub .hero-v{font-size:clamp(16px,4vw,24px);color:var(--paper)}

/* compact meta line — replaces the old chip row (sets/reps/rest/tempo each as
   its own pill). One line of small text carries the same info with far less
   visual weight; it's context, not a second hero. */
.meta-line{font:700 13px/1.5 Inter,sans-serif;color:var(--steel);margin-top:8px}
.meta-line b{color:var(--mist);font-weight:700}
.meta-line span+span::before{content:"·";margin:0 7px;color:var(--line)}

.check{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);
  background:transparent;cursor:pointer;display:grid;place-items:center;margin-top:3px}

/* top progress bar — replaces the old pager (prev/next buttons + name/count
   readout). The card directly underneath already shows the exercise name and
   you swipe left/right to move between cards, so that upper nav was pure
   redundancy. Keep just a thin mint bar for the "where am I" pop of color. */
.topprog{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 8px}
.topprog i{display:block;height:100%;background:var(--signal);transition:width 220ms var(--ease-out)}

/* carousel — fixed-height viewport so switching cards never shifts the page around it;
   grows substantially once focus mode frees up the header/nav space above it */
.carousel{overflow:hidden;position:relative;touch-action:pan-y;height:min(68vh,600px);
  transition:height 420ms var(--ease-out)}
body.focus .carousel{height:min(90vh,860px)}
.track{display:flex;height:100%;will-change:transform}
@keyframes mainFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
main.dayswap{animation:mainFade 220ms var(--ease-out)}
@media(prefers-reduced-motion:reduce){main.dayswap{animation:none}}
.page{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:2px 2px 20px}

.completebar{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;
  margin-top:8px;padding:12px;border-radius:999px;border:1.5px solid var(--line);
  background:transparent;color:var(--mist);font-family:'Barlow Condensed',sans-serif;
  font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;
  transition:background 150ms var(--ease-out),border-color 150ms var(--ease-out),color 150ms var(--ease-out)}
.completebar svg{width:16px;height:16px;opacity:0;transition:opacity 150ms var(--ease-out)}
.completebar.done{background:var(--go);border-color:var(--go);color:var(--ink)}
.completebar.done svg{opacity:1}
.completebar:active{transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.completebar:not(.done):hover{border-color:var(--signal);color:var(--signal)}}

.recap{display:flex;flex-direction:column;gap:2px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:4px}
.recaprow{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--plate2);
  border:none;color:var(--mist);font:500 15px Inter,sans-serif;text-align:left;cursor:pointer;
  transition:background 140ms var(--ease-out),color 140ms var(--ease-out)}
.rcheck{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);
  display:grid;place-items:center;transition:background 140ms var(--ease-out),border-color 140ms var(--ease-out)}
.rcheck svg{width:11px;height:11px;opacity:0;transition:opacity 140ms var(--ease-out)}
.recaprow.done{color:var(--paper)}
.recaprow.done .rcheck{background:var(--go);border-color:var(--go)}
.recaprow.done .rcheck svg{opacity:1}

.rx{display:grid;grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:1px;
  margin-top:13px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rx div{background:var(--plate2);padding:10px 11px}
.rx .k{font:800 9.5px/1 Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--steel)}
.rx .v{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;margin-top:4px;line-height:1.2}
.rx div.hl{background:rgba(52,230,163,.14)}
.rx div.hl .v{color:var(--signal)}

.finhero{border-radius:16px;padding:24px 20px;margin:0 0 16px;text-align:center;
  background:var(--plate2);border:1px solid var(--line);
  transition:background 220ms var(--ease-out),border-color 220ms var(--ease-out)}
.finhero.complete{background:var(--go);border-color:var(--go)}
.finring{width:56px;height:56px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  background:var(--line);transition:background 220ms var(--ease-out)}
.finhero.complete .finring{background:var(--ink)}
.finring svg{width:24px;height:24px;stroke:var(--steel);transition:stroke 220ms var(--ease-out)}
.finhero.complete .finring svg{stroke:var(--signal)}
.finhero h2{font-family:'Barlow Condensed',sans-serif;font-size:28px;text-transform:uppercase;
  margin:0 0 4px;letter-spacing:.01em}
.finhero.complete h2{color:var(--ink)}
.finhero p{color:var(--steel);font-size:14px;margin:0;line-height:1.5}
.finhero.complete p{color:rgba(10,10,10,.65)}
.finstats{display:flex;justify-content:center;gap:24px;margin-top:16px}
.finstat{display:flex;flex-direction:column;align-items:center}
.finstat b{font-family:'Barlow Condensed',sans-serif;font-size:22px;line-height:1}
.finhero.complete .finstat b{color:var(--ink)}
.finstat span{font:800 9px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:var(--steel);margin-top:5px}
.finhero.complete .finstat span{color:rgba(10,10,10,.55)}

.cue-wrap{margin:4px 0}
.cue{color:var(--mist);font-size:14.5px;line-height:1.55;margin:0;
  padding-left:14px;border-left:3px solid var(--signal)}
.watchform{display:inline-flex;align-items:center;gap:5px;font:800 12px/1 'Barlow Condensed',sans-serif;
  letter-spacing:.04em;text-transform:uppercase;color:var(--signal);text-decoration:none;
  margin:2px 0 6px;padding:0}

/* standalone green "begin workout" intro page — shown after picking a day,
   before the exercise carousel. Simple: focus tag, description, equipment,
   one CTA. Deliberately doesn't reuse the dark .ex card styling. */
.page.ovpage{padding:0}
.ov{height:100%}
.ovwrap{background:var(--signal);border-radius:0;padding:28px 22px 22px;color:var(--ink);
  min-height:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column}
.ovwrap .oveyebrow{font:800 11px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:rgba(10,10,10,.55)}
.ovwrap h2{font-family:'Barlow Condensed',sans-serif;font-size:38px;font-weight:800;text-transform:uppercase;
  margin:8px 0 2px;line-height:1.02}
.ovwrap .ovfocus{font:700 14px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.03em;
  color:rgba(10,10,10,.7)}
.ovwrap .ovnote{font-size:15px;line-height:1.55;color:rgba(10,10,10,.75);margin:14px 0 0}
.ovmeta{display:flex;gap:20px;margin-top:18px}
.ovmeta div{flex:1 1 0}
.ovmeta .k{font:800 9.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:rgba(10,10,10,.5)}
.ovmeta .v{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;margin-top:4px}
.ovwatch{display:flex;align-items:center;justify-content:space-between;margin-top:14px;
  background:rgba(10,10,10,.08);border:1px solid rgba(10,10,10,.16);border-radius:14px;padding:10px 14px}
.ovwatch .wk{font:800 9.5px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:rgba(10,10,10,.55)}
.ovwatch .wv{font:700 13px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;color:var(--ink)}
.ovgear{margin-top:18px}
.ovgear .gk,.ovmuscle .gk{display:block;font:800 9.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(10,10,10,.5);margin-bottom:8px}
.ovgear .gpill{display:inline-block;background:rgba(10,10,10,.08);border:1px solid rgba(10,10,10,.16);
  color:var(--ink);font:700 12px/1 Inter,sans-serif;padding:7px 12px;border-radius:999px;margin:0 6px 6px 0}
.ovmuscle{margin-top:18px}
.musclefigs{display:flex;gap:18px}
.musclefig{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px}
.musclefig svg{width:52px;height:96px}
.musclefig span{font:700 9px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:rgba(10,10,10,.45)}
.mlegends{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mlegend{font:700 11px/1 Inter,sans-serif;padding:6px 10px;border-radius:999px;
  background:rgba(10,10,10,.08);color:rgba(10,10,10,.55)}
.mlegend.primary{background:var(--ink);color:var(--signal)}
.ovbegin{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;border:none;background:var(--ink);color:var(--signal);padding:17px;border-radius:999px;
  cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;transition:transform 120ms var(--ease-out)}
.ovbegin:active{transform:scale(.97)}
.watchform:active{opacity:.7}

/* illustration docks small by default (identification, not the focus) — a view
   toggle swaps side/front rather than showing both stacked at once */
.figdock{max-width:130px;margin:4px auto 0;transition:max-width 220ms var(--ease-out)}
.figdock.expanded{max-width:100%}
.plate{background:var(--plate2);border:1px solid var(--line);border-radius:14px;padding:8px;position:relative}
.plate svg{display:block;width:100%;height:auto}
.plabel{position:absolute;top:8px;left:10px;font:800 9px/1 Inter,sans-serif;
  letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.fcap{display:flex;justify-content:space-around;margin-top:4px}
.fcap span{font:700 10.5px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.viewrow{display:flex;justify-content:center;gap:8px;margin-top:10px}
.viewtoggle{background:transparent;border:1.5px solid var(--line);color:var(--steel);
  font:700 10.5px/1 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;
  padding:7px 13px;border-radius:999px;cursor:pointer;transition:border-color 140ms var(--ease-out),color 140ms var(--ease-out)}
.viewtoggle[aria-pressed=true]{border-color:var(--signal);color:var(--signal)}
.viewtoggle:active{transform:scale(.95)}

.dbtn{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;border:1.5px solid var(--line);
  background:transparent;color:var(--paper);padding:10px 18px;border-radius:999px;cursor:pointer}
.dbtn.pri{background:var(--signal);color:var(--ink);border-color:var(--signal)}
.dbtn:active{transform:scale(.95)}
.dbtn{transition:border-color 140ms var(--ease-out),color 140ms var(--ease-out),background 140ms var(--ease-out)}
@media(hover:hover) and (pointer:fine){
  .dbtn:not(.pri):hover{border-color:var(--signal);color:var(--signal)}
  .pbtn:not(:disabled):hover{border-color:var(--signal)}
  .recaprow:hover{color:var(--paper)}
  .gpill:hover{border-color:var(--steel)}
}

.panel{border:1px solid var(--rule);border-radius:18px;background:var(--plate);padding:20px;margin:18px 0}
.panel h3{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;
  text-transform:uppercase;margin-bottom:6px}
.panel .lede{color:var(--steel);font-size:14px;line-height:1.55;margin:0 0 16px}
.wrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=number]{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;
  background:var(--plate2);border:1.5px solid var(--line);color:var(--paper);
  padding:11px 13px;border-radius:12px;width:112px}
input:focus-visible,button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.spark{margin-top:16px}.spark svg{width:100%;height:64px;display:block;overflow:visible}
.spark polyline{animation:sparkDraw 700ms var(--ease-out) forwards}
@keyframes sparkDraw{from{stroke-dashoffset:var(--sparklen,0)}to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.spark polyline{animation:none;stroke-dashoffset:0!important}}
.wlist{font:700 12px/1 Inter,sans-serif;letter-spacing:.02em;color:var(--steel);
  margin-top:10px;display:flex;gap:15px;flex-wrap:wrap}
.mbar{transform-box:fill-box;transform-origin:bottom;animation:barGrow 480ms var(--ease-out) backwards}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media(prefers-reduced-motion:reduce){.mbar{animation:none}}
.macro{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:9px;margin:13px 0}
.macro div{background:var(--plate2);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.macro .k{font:800 9.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.macro .v{font-family:'Barlow Condensed',sans-serif;font-size:21px;font-weight:700;margin-top:4px}
.meals{list-style:none;padding:0;margin:0}
.meals li{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--rule);font-size:14.5px;line-height:1.45}
.meals li b{font:800 10px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:var(--steel);flex:0 0 66px;padding-top:3px}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
@media(max-width:520px){
  .brand h1{font-size:32px}
  .brand .sub{margin-left:0;margin-top:10px}
  .exi h3,.hero-name{font-size:27px}
  .shead h2{font-size:26px}
}
</style>

/* bold-outline restyle: rather than stroke every individual capsule/circle

function makeOutlineFilter(id,radius){

  filter.appendChild(el('feComposite',{in:'ink',in2:'dilated',operator:'in',result:'outline'}));
  const merge=el('feMerge',{});
  merge.appendChild(el('feMergeNode',{in:'outline'}));
  merge.appendChild(el('feMergeNode',{in:'SourceGraphic'}));
  filter.appendChild(merge);

}
function ensureFigureFilter(){

  const defs=el('defs',{});

const RAD=d=>d*Math.PI/180;
const up=(p,l,a)=>[p[0]+l*Math.sin(RAD(a)),p[1]+l*Math.cos(RAD(a))];

function solve(p){

  const kn2=dn(hip,L.thigh,g('thigh2',p.thigh)), an2=dn(kn2,L.shin,g('shin2',p.shin));

  const rot=g('rot',0);

}
function lerpPose(a,b,t){

    o[k]=(typeof x==='number'&&typeof y==='number')?x+(y-x)*t:(t<.5?x:y);});

}
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;   /* stronger cubic ease — more character than quadratic */
const NS='http://www.w3.org/2000/svg';

/* a limb is a tapered capsule: two joint circles + the quad between their external tangents */
function taperD(A,ra,B,rb){
  const ax=A[0], ay=-A[1], bx=B[0], by=-B[1];
  const dx=bx-ax, dy=by-ay, d=Math.hypot(dx,dy);
  if(d<1e-6||d<=Math.abs(ra-rb))return '';
  const th=Math.atan2(dy,dx), al=Math.acos((ra-rb)/d);
  const P=[[ax+ra*Math.cos(th+al),ay+ra*Math.sin(th+al)],
           [bx+rb*Math.cos(th+al),by+rb*Math.sin(th+al)],
           [bx+rb*Math.cos(th-al),by+rb*Math.sin(th-al)],
           [ax+ra*Math.cos(th-al),ay+ra*Math.sin(th-al)]];
  return 'M'+P.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join('L')+'Z';
}
/* torso silhouette: depth profile along the hip→neck axis [t, front, back] */
const PROF=[[0,11,-10.5],[.30,9.5,-9.5],[.62,13.5,-11.5],[.86,12.5,-12],[1,6.5,-7.5]];
function torsoD(hip,neck){
  let ux=neck[0]-hip[0], uy=neck[1]-hip[1];
  const n=Math.hypot(ux,uy)||1; ux/=n; uy/=n;
  const px=uy, py=-ux, f=[], b=[];
  PROF.forEach(([t,fr,bk])=>{
    const cx=hip[0]+ux*n*t, cy=hip[1]+uy*n*t;
    f.push([cx+px*fr,-(cy+py*fr)]); b.push([cx+px*bk,-(cy+py*bk)]);
  });
  return 'M'+f.concat(b.reverse()).map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join('L')+'Z';
}
function figureGroup(){

    g.append(o.a,o.b,o.p); return o;};

  const far=set(FAR);

  const nk=seg(NEAR);
  const head=el('ellipse',{rx:10.5,ry:12.5,fill:NEAR}); g.appendChild(head);
  const rim=set(BGP), near=set(NEAR);
  const load=el('g',{}); g.appendChild(load);

}

    F.benchLegL.setAttribute('x1',x0+8); F.benchLegL.setAttribute('x2',x0+8);
    F.benchLegL.setAttribute('y1',-y0); F.benchLegL.setAttribute('y2',0);
    F.benchLegR.setAttribute('x1',x1-8); F.benchLegR.setAttribute('x2',x1-8);

  else if(p.load==='bar')F.load.appendChild(el('rect',{x:j.wrist[0]-5.5,y:-j.wrist[1]-14,

function makePlate(frames,animated,labels){

const running=[];

/* a real rep isn't constant motion — it settles briefly at each end, then moves.

function poseAtPhase(frames,phase,holdFrac){
  const n=frames.length, i=Math.floor(phase)%n, next=(i+1)%n;

/* ═══════ FRONTAL-PLANE RIG — separate projection, verified independently against

const LF={thigh:51,shin:48,torso:64,neck:17,ua:42,fa:40};
const HIPW=15, SHW=19;
function solveF(p){
  // every per-side angle is a plain outward magnitude — direction comes from the
  // side multiplier s (-1 left, +1 right) here only; never pass a signed value in.
  const g=(k,d)=>p[k]!==undefined?p[k]:d, hipC=[g('shift',0),0], out={};
  [[-1,'L'],[1,'R']].forEach(([s,tag])=>{
    const hip=[hipC[0]+s*HIPW,hipC[1]];
    const thA=g('thigh'+tag,10);
    const knee=[hip[0]+s*LF.thigh*Math.sin(RAD(thA)),hip[1]-LF.thigh*Math.cos(RAD(thA))];
    const shA=g('shin'+tag,10);
    const ankle=[knee[0]+s*LF.shin*Math.sin(RAD(shA)),knee[1]-LF.shin*Math.cos(RAD(shA))];
    out['hip'+tag]=hip; out['knee'+tag]=knee; out['ankle'+tag]=ankle;
  });
  const lean=g('lean',0);
  const neck=[hipC[0]+Math.sin(RAD(lean))*LF.torso,hipC[1]+Math.cos(RAD(lean))*LF.torso];
  const head=[neck[0]+Math.sin(RAD(lean))*LF.neck,neck[1]+Math.cos(RAD(lean))*LF.neck];
  const sh=[hipC[0]+(neck[0]-hipC[0])*.94,hipC[1]+(neck[1]-hipC[1])*.94];
  [[-1,'L'],[1,'R']].forEach(([s,tag])=>{

    const aA=g('arm'+tag,4);

    const faA=g('fore'+tag,g('arm'+tag,4));
    const wrist=[elbow[0]+s*LF.fa*Math.sin(RAD(faA)),elbow[1]-LF.fa*Math.cos(RAD(faA))];
    out['sh'+tag]=shPt; out['elbow'+tag]=elbow; out['wrist'+tag]=wrist;
  });

/* ISO week number — a pure function of the date, so any past date always resolves to
   the same week variant it actually used, with no state to track */
function isoWeekNumber(d){
  const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dayNum=(dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-dayNum+3);
  const firstThu=new Date(Date.UTC(dt.getUTCFullYear(),0,4));
  const firstDayNum=(firstThu.getUTCDay()+6)%7;
  firstThu.setUTCDate(firstThu.getUTCDate()-firstDayNum+3);
  return 1+Math.round((dt-firstThu)/(7*24*3600*1000));
}

function sessionMins(day){
  let s=0;
  day.ex.forEach(x=>{s+=x.sets*x.work+Math.max(0,x.sets-1)*x.rest;});
  s+=day.ex.length*45;                    // setup, plate changes, walking between stations
  return Math.round(s/60);
}
/* what to physically set out before starting — dedup + split compound kit strings,
   but keep "X, or Y" together since that is a choice, not two items to gather */
function dayGear(day){
  const seen=[];
  day.ex.forEach(x=>{
    if(x.kit==='Bodyweight')return;
    if(x.kit.includes(', or ')){ if(!seen.includes(x.kit))seen.push(x.kit); return; }
    x.kit.split(' + ').forEach(part=>{part=part.trim(); if(!part)return;
      part=part[0].toUpperCase()+part.slice(1);
      if(!seen.includes(part))seen.push(part);});
  });
  return seen;
}

const KEY='mb:v4';
/* plain localStorage — works on any host, no Claude-artifact runtime required */
async function load(){
  try{const raw=localStorage.getItem(KEY);
    if(raw)Object.assign(S,JSON.parse(raw),{day:S.day});}catch(e){}
}
async function save(){
  try{localStorage.setItem(KEY,JSON.stringify({done:S.done,weights:S.weights,ratings:S.ratings}));}catch(e){}
}

/* dates — local (not UTC) so the day boundary matches the clock on his phone */
function localDateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function todayKey(){return localDateKey(new Date());}
function mondayOf(d){const wd=(d.getDay()+6)%7, m=new Date(d); m.setDate(d.getDate()-wd); m.setHours(0,0,0,0); return m;}
function weekDatesFor(monday){const out=[]; for(let i=0;i<7;i++){const dt=new Date(monday); dt.setDate(monday.getDate()+i); out.push(localDateKey(dt));} return out;}
/* a "session" for a given calendar date + program day is complete once every
   exercise in that day's list is checked under that date's key */
function sessionDoneOnDate(dateKey,dayIdx){
  const total=PROGRAM[dayIdx].ex.length; if(!total)return false;
  let n=0; for(let i=0;i<total;i++) if(S.done[dateKey+':'+dayIdx+':'+i])n++;
  return n===total;
}
function dayDoneThisWeek(dayIdx){
  return weekDatesFor(mondayOf(new Date())).some(dk=>sessionDoneOnDate(dk,dayIdx));
}
/* tapping a weekly-tracker pip marks that whole day's session done, or undoes it —
   a way to backfill a session you forgot to check off, or fix a mistaken tap */
function toggleDaySession(dateKey,dayIdx){
  const total=PROGRAM[dayIdx].ex.length; if(!total)return;
  const isDone=sessionDoneOnDate(dateKey,dayIdx);
  for(let i=0;i<total;i++){
    const k=dateKey+':'+dayIdx+':'+i;
    if(isDone)delete S.done[k]; else S.done[k]=true;
  }
  save(); drawNav();
}
function weeklyStats(weeksBack){
  const thisMonday=mondayOf(new Date()), weeks=[];
  for(let w=weeksBack-1; w>=0; w--){
    const monday=new Date(thisMonday); monday.setDate(thisMonday.getDate()-7*w);
    const dates=weekDatesFor(monday);
    const per=[0,1,2,3,4,5,6].map(di=>dates.some(dk=>sessionDoneOnDate(dk,di)));
    weeks.push({monday,per,done:per.filter(Boolean).length});
  }
  return weeks;
}

/* difficulty rating — one entry per day-slot per calendar date; a same-day re-tap overwrites */
const RATINGS=[
 {v:'too_easy',label:'Too easy',short:'Easy',note:'add weight to the main lifts'},
 {v:'easy',label:'A bit easy',short:'A bit easy',note:null},
 {v:'right',label:'Just right',short:'On track',note:null},
 {v:'hard',label:'A bit hard',short:'A bit hard',note:null},
 {v:'too_hard',label:'Too hard',short:'Too hard',note:'hold steady or ease back a set'},
];
const sameDate=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
function lastRating(day){
  for(let i=S.ratings.length-1;i>=0;i--) if(S.ratings[i].day===day) return S.ratings[i];
  return null;
}
function setRating(day,v){
  const now=Date.now(), mine=S.ratings.filter(r=>r.day===day);
  const today=mine.find(r=>sameDate(r.d,now));
  if(today)today.v=v; else S.ratings.push({day,d:now,v});
  if(S.ratings.length>400)S.ratings.splice(0,S.ratings.length-400);
  save();
}

/* short cards (most exercises) don't fill the carousel's fixed viewport height —
   vertically center each card within its .page instead of leaving it glued to the
   top with dead space below. Padding-based, not flex/grid alignment, so an
   oversized card (front-view toggle + expanded note) never clips its own top —
   it just falls back to top-aligned + scrollable. Recomputed via ResizeObserver
   so it tracks content changes (cue expand, view toggle) and the focus-mode
   height transition settling. */
function recenterPage(pw){
  const child=pw.firstElementChild;
  if(!child)return;
  const avail=pw.clientHeight, contentH=child.scrollHeight;
  pw.style.paddingTop=Math.max(2,Math.round((avail-contentH-20)/2)+2)+'px';
}
function recenterAllPages(){
  const track=main&&main.querySelector('.track');
  if(track)track.querySelectorAll('.page').forEach(recenterPage);
}

      figdock.classList.remove('expanded');
      sideBtn.setAttribute('aria-pressed','true'); frontBtn.setAttribute('aria-pressed','false');
    };
    inner.appendChild(vrow);
  }

  const k=todayKey()+':'+S.day+':'+i;
  const cbar=document.createElement('button');
  function paintBar(){
    const on=!!S.done[k];
    cbar.className='completebar'+(on?' done':'');
    cbar.setAttribute('aria-pressed',on);
    cbar.innerHTML=(on?'<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg> Completed':'Mark complete');
  }
  paintBar();
  cbar.onclick=()=>{
    const wasDone=!!S.done[k];
    toggleDone(i);
    // marking complete (not un-marking) auto-advances to the next card — a
    // brief delay so the checkmark actually registers before the swipe
    if(!wasDone&&S.done[k])setTimeout(()=>goTo(CX+1),380);
  };
  toggleHandlers[i]=toggleHandlers[i]||{}; toggleHandlers[i].refreshBar=paintBar;
  inner.appendChild(cbar);

  c.appendChild(inner);
  return {el:c,anims};
}

  day.ex.forEach((x,i)=>{

      row.setAttribute('aria-pressed',on);
    }
    row.innerHTML='<span class="rcheck"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.5 3.5L13 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>'+x.name+'</span>';
    paintRow();
    row.onclick=()=>toggleDone(i);
    toggleHandlers[i]=toggleHandlers[i]||{}; toggleHandlers[i].refreshRecap=paintRow;
    recap.appendChild(row);
  });
  inner.appendChild(recap);
  c.appendChild(inner);
  buildRatingPanel(inner);
  buildFuelPanel(inner);
  buildWeightPanel(inner);
  return c;
}

function drawDay(){
  toggleHandlers={};
  const day=PROGRAM[S.day];
  pages=[{type:'overview',el:buildOverviewCard(day),anims:[]}];
  day.ex.forEach((x,i)=>{
    const built=buildExerciseCard(x,i,day.ex.length);
    pages.push({type:'exercise',el:built.el,anims:built.anims,name:x.name});
  });
  pages.push({type:'finish',el:buildFinishCard(day),anims:[]});

  main.textContent='';
  const prog=document.createElement('div'); prog.className='topprog';
  prog.innerHTML='<i id="pFill"></i>';
  main.appendChild(prog);

  const carousel=document.createElement('div'); carousel.className='carousel';
  const track=document.createElement('div'); track.className='track';
  pages.forEach(pg=>{const pw=document.createElement('div'); pw.className='page'+(pg.type==='overview'?' ovpage':''); pw.appendChild(pg.el); track.appendChild(pw);});
  carousel.appendChild(track);
  main.appendChild(carousel);

  wireTouch(carousel,track);

  if(pageRO)pageRO.disconnect();
  if(window.ResizeObserver){
    pageRO=new ResizeObserver(recenterAllPages);
    pageRO.observe(carousel);
    pages.forEach(pg=>pageRO.observe(pg.el));
  }
  recenterAllPages();

  if(CX>=pages.length)CX=0;
  goTo(CX,false);
}

/* ═══════ CAROUSEL SPRING — a damped spring, not a CSS transition. The difference
   matters: a transition animates toward a fixed end value and can't be redirected
   mid-flight without a visible snap. A spring carries its current position AND
   velocity, so grabbing it mid-settle (or reversing a flick) continues smoothly
   from wherever it actually is right now — never from where it "should" be. ═══════ */
let trackPos=0, trackVel=0, springTarget=0, springLast=0, springOn=false;
function springStep(dt){
  const k=210, c=27;                 /* ~critically damped, response ≈ 0.35s (apple-design §4) */
  const disp=trackPos-springTarget;
  const acc=-k*disp - c*trackVel;
  trackVel+=acc*dt; trackPos+=trackVel*dt;
}
function springFrame(ts){
  if(!springOn)return;
  const dt=Math.min(0.032,(ts-springLast)/1000||0.016); springLast=ts;
  springStep(dt);
  const track=main.querySelector('.track');
  if(track)track.style.transform='translateX('+trackPos+'%)';
  if(Math.abs(trackPos-springTarget)<0.25&&Math.abs(trackVel)<0.4){
    trackPos=springTarget; trackVel=0; springOn=false;
    if(track)track.style.transform='translateX('+trackPos+'%)';
    return;
  }
  requestAnimationFrame(springFrame);
}
function springTo(target,vel){
  springTarget=target;
  if(vel!==undefined)trackVel=vel;
  if(!springOn){springOn=true; springLast=performance.now(); requestAnimationFrame(springFrame);}
}

function goTo(idx,animate){
  idx=Math.max(0,Math.min(pages.length-1,idx));
  CX=idx;
  const target=-(idx*100);
  if(animate===false){
    trackPos=target; trackVel=0; springTarget=target; springOn=false;
    const track=main.querySelector('.track'); if(track)track.style.transform='translateX('+target+'%)';
  }else{
    springTo(target);   /* starts from wherever the track presentation-value currently is */
  }
  const pg=pages[idx];
  const fill=document.getElementById('pFill');
  if(fill)fill.style.width=((idx+1)/pages.length*100)+'%';
  running.length=0;
  (pg.anims||[]).forEach(a=>running.push(a));
  const activeEx=pg.el.classList.contains('ex')?pg.el:pg.el.querySelector('.ex');
  if(activeEx){activeEx.classList.remove('reveal'); void activeEx.offsetWidth; activeEx.classList.add('reveal');}
}


function wireTouch(carousel,track){
  let startX=0,startY=0,curX=0,active=false,decided=false,horizontal=false,startTime=0,onControl=false;
  let baseTarget=0, hist=[];
  const W=()=>carousel.getBoundingClientRect().width||1;
  function onStart(e){
    const t=e.touches?e.touches[0]:e;
    onControl=!!(e.target&&e.target.closest&&e.target.closest('button,input,a,select,textarea'));
    startX=t.clientX; startY=t.clientY; curX=startX;
    active=!onControl; decided=false; horizontal=false; startTime=Date.now();
    hist=[{x:t.clientX,t:performance.now()}];
    if(!onControl){
      springOn=false;              /* interrupt: grab the live position, don't wait for settle */
      baseTarget=trackPos;         /* drag adds to wherever the spring currently sits */
    }
  }
  function onMove(e){
    if(!active||onControl)return;
    const t=e.touches?e.touches[0]:e;
    const dx=t.clientX-startX, dy=t.clientY-startY;
    if(!decided){
      if(Math.abs(dx)>6||Math.abs(dy)>6){decided=true; horizontal=Math.abs(dx)>Math.abs(dy);}
      else return;
    }
    if(!horizontal){active=false; return;}
    if(e.cancelable)e.preventDefault();
    curX=t.clientX;
    hist.push({x:t.clientX,t:performance.now()}); if(hist.length>5)hist.shift();
    let delta=dx;
    const atStart=baseTarget>=-0.5, atEnd=baseTarget<=-((pages.length-1)*100-0.5);
    if((atStart&&delta>0)||(atEnd&&delta<0))delta*=0.35;   /* rubber-band past the ends */
    trackPos=baseTarget+(delta/W())*100;
    track.style.transform='translateX('+trackPos+'%)';
  }
  function onEnd(){
    if(onControl){onControl=false; active=false; return;}
    if(!active)return; active=false;
    if(!decided||!horizontal)return;
    let v=0;
    if(hist.length>=2){
      const a=hist[0], b=hist[hist.length-1], dt=Math.max(1,b.t-a.t);
      v=(b.x-a.x)/dt;   /* px/ms, recent-history velocity — not just the last two points */
    }
    const dx=curX-startX, threshold=W()*0.16;
    let next=CX;
    if(dx<-threshold||v<-0.4)next=CX+1;
    else if(dx>threshold||v>0.4)next=CX-1;
    next=Math.max(0,Math.min(pages.length-1,next));
    goTo(next, next!==CX||Math.abs(v)>0.05?true:false);
    /* hand off release velocity so the settle continues the finger's motion —
       no seam between the drag and the spring (apple-design §5) */
    springTo(-(next*100), v*100/W()*1000*0.6);
  }
  carousel.addEventListener('touchstart',onStart,{passive:true});
  carousel.addEventListener('touchmove',onMove,{passive:false});
  carousel.addEventListener('touchend',onEnd);
  carousel.addEventListener('touchcancel',onEnd);
}
document.addEventListener('keydown',e=>{
  if(document.activeElement&&document.activeElement.tagName==='INPUT')return;
  if(e.key==='ArrowLeft')goTo(CX-1);
  else if(e.key==='ArrowRight')goTo(CX+1);
});

function buildWeekTrackerPanel(container){
  const p=document.createElement('div'); p.className='panel';
  const body=document.createElement('div');
  function refresh(){
    const weeks=weeklyStats(5), DOWS=['M','T','W','T','F','S','S'], today=todayKey();
    const rows=weeks.map((w,idx)=>{
      const isCurrent=idx===weeks.length-1;
      const label=w.monday.toLocaleDateString(undefined,{month:'short',day:'numeric'});
      const dates=weekDatesFor(w.monday);
      const pips=w.per.map((on,i)=>{
        const dk=dates[i], future=dk>today;
        return '<button type="button" class="pip '+(on?'on':'off')+'" data-date="'+dk+'" data-day="'+i+'"'+
          (future?' disabled':'')+'>'+DOWS[i]+'</button>';
      }).join('');
      return '<div class="wkrow'+(isCurrent?' cur':'')+'"><span class="wkdate">'+label+
        (isCurrent?' · this week':'')+'</span><span class="wkpips">'+pips+'</span></div>';
    }).reverse().join('');
    body.innerHTML='<div class="wktrack">'+rows+'</div>';
    body.querySelectorAll('.pip:not([disabled])').forEach(btn=>{
      btn.onclick=()=>{toggleDaySession(btn.dataset.date,+btn.dataset.day); refresh();};
    });
  }
  p.innerHTML='<h3>Weekly adherence</h3><p class="lede">Tap a day to mark it done or undo it — handy if you forgot to check off a session. Built from the same checkmarks you tap each workout.</p>';
  p.appendChild(body);
  refresh();
  container.appendChild(p);
}

function buildWeeklyChart(container){
  const p=document.createElement('div'); p.className='panel';
  const weeks=weeklyStats(8);
  const target=5;                        /* every weekday, one reference line */
  const maxV=Math.max(target+2,...weeks.map(wk=>wk.done));
  const w=600,h=110,gap=14,barW=(w-gap*(weeks.length-1))/weeks.length;
  const yFor=v=>h-(v/maxV)*h;
  const bars=weeks.map((wk,i)=>{
    const x=i*(barW+gap), bh=Math.max((wk.done/maxV)*h,wk.done>0?3:0), y=h-bh;
    const isCurrent=i===weeks.length-1;
    const fill=isCurrent?'#34E6A3':'#3A3A3A';
    const numColor=isCurrent?'#34E6A3':'#C9C9C9';
    const label=wk.monday.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    return '<rect class="mbar" style="animation-delay:'+(i*35)+'ms" x="'+x+'" y="'+y+'" width="'+barW+'" height="'+bh+'" rx="4" fill="'+fill+'"/>'+
      '<text x="'+(x+barW/2)+'" y="'+(y-7)+'" text-anchor="middle" font-family="IBM Plex Mono" '+
      'font-size="12" font-weight="600" fill="'+numColor+'">'+wk.done+'</text>'+
      '<text x="'+(x+barW/2)+'" y="'+(h+18)+'" text-anchor="middle" font-family="Inter" '+
      'font-size="11" font-weight="700" fill="#8C8C8C">'+label+'</text>';
  }).join('');
  p.innerHTML='<h3>Weekly progress</h3><p class="lede">Days you worked out, by week. Dashed line marks hitting every weekday.</p>'+
    '<svg viewBox="0 -20 '+w+' '+(h+40)+'" style="width:100%;height:auto;overflow:visible" aria-hidden="true">'+
    '<line x1="0" y1="'+yFor(target)+'" x2="'+w+'" y2="'+yFor(target)+'" stroke="#34E6A3" '+
    'stroke-width="1.5" stroke-dasharray="5 5" opacity="0.55"/>'+bars+'</svg>';
  container.appendChild(p);
}

function buildRatingPanel(container){
  const p=document.createElement('div'); p.className='panel';
  p.innerHTML='<h3>Rate this session</h3><p class="lede">How did today\'s weights and reps feel overall? This is what the nudge at the top of tomorrow\'s session is based on.</p>';
  const row=document.createElement('div'); row.className='rate-row';
  const note=document.createElement('div'); note.className='wlist';
  function refresh(){
    const today=lastRating(S.day), sameDay=today&&sameDate(today.d,Date.now());
    row.querySelectorAll('.ratebtn').forEach(b=>{
      const on=sameDay&&today.v===b.dataset.v;
      b.setAttribute('aria-pressed',on?'true':'false');
    });
    note.innerHTML=sameDay?'<span>Logged for today — tap another option to change it.</span>':'';
  }
  RATINGS.forEach(r=>{
    const b=document.createElement('button');
    b.className='ratebtn'; b.textContent=r.label; b.dataset.v=r.v;
    b.onclick=()=>{
      setRating(S.day,r.v); refresh();
      b.classList.remove('pulse'); void b.offsetWidth; b.classList.add('pulse');
    };
    row.appendChild(b);
  });
  refresh();
  p.append(row,note);
  container.appendChild(p);
  ratingPanelRefresh=refresh;
}

  const f=FUEL[S.day], p=document.createElement('div'); p.className='panel';
  p.innerHTML='<h3>Fuel</h3><p class="lede">A ~500 kcal deficit off an estimated maintenance around 2,900 — enough to lose roughly a pound a week without working against the muscle this training is trying to build.</p>'+
  '<div class="macro">'+
    '<div><div class="k">Calories</div><div class="v">2,450</div></div>'+
    '<div><div class="k">Protein</div><div class="v">165 g</div></div>'+
    '<div><div class="k">Fat</div><div class="v">75 g</div></div>'+
    '<div><div class="k">Carbs</div><div class="v">280 g</div></div>'+
  '</div><ul class="meals">'+
    '<li><b>Pre</b><span>Chike protein iced coffee + 5 g creatine — already covers roughly 25 g of the protein target.</span></li>'+
    '<li><b>Breakfast</b><span>'+f[0]+'</span></li>'+
    '<li><b>Lunch</b><span>'+f[1]+'</span></li>'+
    '<li><b>Dinner</b><span>'+f[2]+(S.day===4?' — one relaxed meal a week is part of the plan, not a break from it.':'')+'</span></li>'+
    '<li><b>Snack</b><span>'+f[3]+'</span></li>'+
    '<li><b>PM</b><span>Omega-3, magnesium, vitamin D with dinner — keep as is.</span></li>'+
  '</ul>';
  container.appendChild(p);
}

function buildWeightPanel(container){
  const p=document.createElement('div'); p.className='panel';
  p.innerHTML='<h3>Weigh-in</h3><p class="lede">Same time each morning, before food. Watch the trend across weeks — day to day it swings 2–3 lb on water alone.</p>';
  const row=document.createElement('div'); row.className='wrow';
  const inp=document.createElement('input');
  inp.type='number'; inp.step='0.1'; inp.placeholder='190.0';
  inp.setAttribute('aria-label','Body weight in pounds');
  const btn=document.createElement('button'); btn.className='dbtn pri'; btn.textContent='Log';
  const dyn=document.createElement('div');
  function refresh(){
    dyn.textContent='';
    const W=S.weights;
    if(W.length){
      const last=W[W.length-1].v;
      bumpStat('sNow',last+'<small> lb</small>');
      bumpStat('sGo',Math.max(0,last-175).toFixed(1)+'<small> lb</small>');
    }
    if(W.length>1){
      const vals=W.map(w=>w.v), mn=Math.min(...vals)-1, mx=Math.max(...vals)+1;
      const w=600,h=64, X=i=>i/(W.length-1)*w, Y=v=>h-(v-mn)/(mx-mn)*h;
      const sp=document.createElement('div'); sp.className='spark';
      sp.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
        '<polyline points="'+vals.map((v,i)=>X(i)+','+Y(v)).join(' ')+'" fill="none" '+
        'stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+
        '<line x1="0" y1="'+Y(175)+'" x2="'+w+'" y2="'+Y(175)+'" stroke="#34E6A3" '+
        'stroke-width="1.5" stroke-dasharray="5 5" opacity="'+(175>=mn&&175<=mx?.9:0)+'"/></svg>';
      dyn.appendChild(sp);
      const poly=sp.querySelector('polyline');
      if(poly&&!reduced){
        const len=poly.getTotalLength();
        poly.style.strokeDasharray=len;
        poly.style.setProperty('--sparklen',len);
        poly.style.strokeDashoffset=len;
      }
      const l=document.createElement('div'); l.className='wlist';
      const dv=vals[vals.length-1]-vals[0];
      l.innerHTML='<span>Latest '+vals[vals.length-1]+' lb</span>'+
        '<span>Change '+(dv>=0?'+':'')+dv.toFixed(1)+' lb</span><span>'+W.length+' entries</span>';
      dyn.appendChild(l);
    }
  }
  btn.onclick=()=>{const v=parseFloat(inp.value); if(!v||v<80||v>500)return;
    S.weights.push({d:Date.now(),v}); if(S.weights.length>60)S.weights.shift();
    inp.value=''; save(); refresh();};
  inp.onkeydown=e=>{if(e.key==='Enter')btn.click();};
  row.append(inp,btn); p.append(row,dyn);
  refresh();
  container.appendChild(p);
}

  document.body.classList.add('home');
